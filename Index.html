<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f0efe9">
<title><?= systemName ?></title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ===== Tema UI disalin dari ICS Absensi: karyawan.html (staf & admin memakai tema yang sama) ===== */
:root,body.th-staff{
  --bg:#f0efe9; --surface:#fff; --surface2:#e8e7e0; --surface3:#dddcd5; --dark:#1a1a1a; --amber:#8a7a5a; --rose:#c0392b; --violet:#4a4a6a; --success:#2d7a4a;
  --text:#1a1a1a; --muted:#7a7a6a; --border:rgba(26,26,26,0.12); --glow:0 4px 24px rgba(0,0,0,0.08);
  --card:var(--surface); --ink:var(--text); --line:var(--border); --accent:var(--dark); --accent-ink:#f0efe9;
  --ok:#2d7a4a; --ok-bg:rgba(45,122,74,.1); --warn:#8a7a5a; --warn-bg:rgba(138,122,90,.1); --bad:#c0392b; --bad-bg:rgba(192,57,43,.08);
  --info:#4a4a6a; --info-bg:rgba(74,74,106,.1); --neu:#7a7a6a; --neu-bg:#e8e7e0; --shadow:none;
  --btn-bg:#1a1a1a; --btn-ink:#f0efe9; --btn-shadow:0 6px 20px rgba(0,0,0,.15); --focus:rgba(26,26,26,.08);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;font-size:15px;line-height:1.45}
h1,h2,h3{line-height:1.25;font-family:'Syne',sans-serif}
h2{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:20px 0 10px}
h3{font-size:15px;font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
#app{position:relative;z-index:1}

/* ---- STAF: .app / .header / .profile-card / .content (karyawan.html) ---- */
.th-staff .app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header.top{padding:14px 20px;background:rgba(240,239,233,.95);backdrop-filter:blur(20px);position:sticky;top:0;z-index:100;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.header-brand{font-family:'Syne',sans-serif;font-size:16px;font-weight:800;letter-spacing:-.5px;display:flex;align-items:center;gap:8px}
.hdr{display:flex;align-items:center;gap:10px}
.clock-pill{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;color:var(--dark);background:var(--surface2);border:1px solid var(--border);padding:7px 14px;border-radius:20px}
.btn-out{background:none;border:1px solid var(--border);color:var(--muted);padding:6px 12px;border-radius:10px;font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif}
.th-staff #main{flex:1;padding:18px;padding-bottom:40px;display:flex;flex-direction:column;gap:14px}
.profile-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:18px;display:flex;align-items:center;gap:14px}
.av{width:52px;height:52px;border-radius:14px;background:var(--dark);display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-size:20px;font-weight:800;color:#f0efe9;flex-shrink:0}
.pi{flex:1;min-width:0}
.pname{font-family:'Syne',sans-serif;font-size:16px;font-weight:700}
.pdept{font-size:12px;color:var(--muted);margin-top:2px}
.pid{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--amber);margin-top:3px}

/* ---- Tab staf (segmen) ---- */
.th-staff nav.tabs{display:flex;background:var(--surface2);border:1px solid var(--border);border-radius:14px;padding:3px;gap:3px}
.th-staff nav.tabs button{flex:1;border:0;background:transparent;min-height:40px;border-radius:11px;cursor:pointer;color:var(--muted);font-family:'Syne',sans-serif;font-weight:700;font-size:13px}
.th-staff nav.tabs button .ic{display:none}
.th-staff nav.tabs button[aria-selected="true"]{background:var(--surface);color:var(--dark);box-shadow:0 1px 4px rgba(0,0,0,.08)}

/* ---- Komponen bersama ---- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:18px}
.stack>*+*{margin-top:10px}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(2,1fr)}
.kpi{position:relative;overflow:hidden;padding:16px}
.kpi .v{font-family:'Syne',sans-serif;font-size:28px;font-weight:800;line-height:1}
.kpi .l{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-top:8px}
.kpi.bad .v{color:var(--bad)} .kpi.ok .v{color:var(--ok)}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;background:var(--neu-bg);color:var(--neu);white-space:nowrap;border:1px solid var(--border)}
.chip.NEW,.chip.PROGRESS{background:var(--info-bg);color:var(--info)}
.chip.PENDING{background:var(--warn-bg);color:var(--warn)} .chip.COMPLETED{background:var(--ok-bg);color:var(--ok)}
.chip.OVERDUE{background:var(--bad-bg);color:var(--bad)} .chip.CANCELLED{background:var(--neu-bg);color:var(--neu)}
.task{display:block;width:100%;text-align:left;cursor:pointer;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px}
.task:active{background:var(--surface2)}
.task .t{font-family:'Syne',sans-serif;font-weight:700;font-size:14px;margin-bottom:3px;overflow-wrap:anywhere}
.task .m{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.task .r{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.task .dl{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600}
.task .dl.late{color:var(--bad)} .task .dl.soon{color:var(--warn)}
.bar{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden;flex:1;min-width:60px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--success),#059669);border-radius:4px}
.pri{font-size:12px;color:var(--muted)}
.pri.Urgent,.pri.High{color:var(--bad);font-weight:700}
label.f{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:14px 0 7px}
input[type=text],input[type=date],input[type=search],input[type=password],select,textarea{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:13px 16px;min-height:46px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:15px;outline:none;transition:border-color .2s,box-shadow .2s}
textarea{min-height:84px;resize:vertical}
input::placeholder,textarea::placeholder{color:var(--muted)}
.th-staff input:focus,.th-staff select:focus,.th-staff textarea:focus{border-color:var(--dark);box-shadow:0 0 0 3px var(--focus)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input[type=range]{width:100%;accent-color:var(--dark);min-height:36px;padding:0;background:none;border:0}
.btn{background:var(--btn-bg);color:var(--btn-ink);border:0;border-radius:12px;min-height:48px;padding:0 20px;font-family:'Syne',sans-serif;font-size:15px;font-weight:700;cursor:pointer;box-shadow:var(--btn-shadow);transition:transform .2s}
.btn:active{transform:scale(.98)}
.btn.sec{background:var(--surface2);color:var(--text);border:1px solid var(--border);box-shadow:none;font-family:'DM Sans',sans-serif;font-weight:600}
.btn.danger{background:var(--rose);color:#fff}
.btn:disabled{background:var(--surface2);color:var(--muted);box-shadow:none;cursor:not-allowed}
.btn.block{width:100%}
.row{display:flex;gap:10px;align-items:center}
.row.wrapr{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.seg{display:flex;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;min-height:38px;border-radius:9px;cursor:pointer;color:var(--muted);font-weight:600;font-family:'DM Sans',sans-serif}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.1)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t thead,table.t tr:first-child{background:var(--surface2)}
table.t th{padding:11px 14px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);text-align:left;white-space:nowrap;border-bottom:1px solid var(--border)}
table.t td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
table.t tr:last-child td{border-bottom:none}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:rgba(0,229,200,.04)} .th-staff table.t tr.click:hover td{background:var(--surface2)}
table.t td.n,table.t th.n{text-align:right;font-family:'IBM Plex Mono',monospace;font-size:12px}
.scroll table.t{min-width:520px}
.scroll{overflow-x:auto;border-radius:12px;border:1px solid var(--border)}
.muted{color:var(--muted)} .small{font-size:12px}
.empty{text-align:center;color:var(--muted);padding:28px 8px;font-size:13px}
.err{color:var(--bad);font-size:12px;margin-top:10px;overflow-wrap:anywhere;background:var(--bad-bg);border:1px solid rgba(192,57,43,.2);padding:10px 14px;border-radius:10px}
.err:empty{display:none}
.okmsg{color:var(--ok);font-size:13px;margin-top:6px}

/* ---- Modal: karyawan .modal (staf) / admin .modal-box ---- */
.modal{position:fixed;inset:0;background:rgba(240,239,233,.98);z-index:500;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(8px)}
.sheet{background:var(--surface);width:100%;max-width:600px;max-height:94vh;overflow:auto;border-radius:24px 24px 0 0;padding:0 18px calc(24px + env(safe-area-inset-bottom));border:1px solid var(--border)}
.th-staff .sheet{background:transparent;border:0;max-height:100vh;height:100%;border-radius:0}
.sheet .hd{position:sticky;top:0;background:var(--surface);padding:16px 0 12px;display:flex;gap:12px;align-items:flex-start;z-index:2;border-bottom:1px solid var(--border);margin-bottom:12px}
.th-staff .sheet .hd{background:rgba(240,239,233,.98)}
.sheet .hd h2{margin:0;flex:1;overflow-wrap:anywhere;font-family:'Syne',sans-serif;font-size:18px;font-weight:700;text-transform:none;letter-spacing:0;color:var(--text)}
.sheet .hd .btn,.sheet .hd .btn.sec{min-height:36px;width:36px;padding:0;background:var(--surface2);color:var(--text);border:1px solid var(--border);box-shadow:none;border-radius:10px;font-size:18px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:8px 10px;font-size:13px}
.kv dt{color:var(--muted);font-size:12px} .kv dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap;font-weight:600}
.ib{width:36px;height:36px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);font-size:16px;cursor:pointer;flex:none;padding:0}
.fg{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.kind{margin-top:12px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--amber);display:flex;justify-content:space-between;align-items:center;gap:8px}
.kind .btn{min-height:34px;padding:0 12px;font-size:12px}
.thumbs .tag{position:absolute;left:0;bottom:0;right:0;background:rgba(0,0,0,.6);color:#fff;font-size:10px;text-align:center;padding:2px 0}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumbs .th{width:84px;height:84px;border-radius:12px;border:1px solid var(--border);background:var(--surface2);overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs .x{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.65);color:#fff;border:0;border-radius:50%;width:24px;height:24px;line-height:24px;font-size:14px;cursor:pointer;padding:0}
.hist{border-left:2px solid var(--border);margin-left:6px;padding-left:12px}
.hist .it{margin-bottom:12px;font-size:13px;overflow-wrap:anywhere}

/* ---- Toast: karyawan (atas-tengah) / admin (kanan-bawah) ---- */
.toast{position:fixed;top:72px;left:50%;transform:translateX(-50%);background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:14px;padding:11px 20px;font-size:13px;font-weight:600;z-index:9999;max-width:90vw;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.15);border-color:rgba(45,122,74,.3);color:var(--success)}
.toast.bad{border-color:rgba(192,57,43,.3);color:var(--rose)}

/* ---- Login: .auth-screen (karyawan) ---- */
.auth-screen{min-height:100vh;max-width:480px;margin:0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;gap:28px}
.auth-logo{text-align:center}
.auth-logo h1{font-family:'Syne',sans-serif;font-size:28px;font-weight:800;letter-spacing:-1px}
.auth-logo p{color:var(--muted);font-size:13px;margin-top:4px}
.auth-card{background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:28px;width:100%;box-shadow:var(--glow)}
.auth-card h2{font-family:'Syne',sans-serif;font-size:20px;font-weight:700;margin:0 0 4px;text-transform:none;letter-spacing:0;color:var(--text)}
.auth-card>p{color:var(--muted);font-size:13px;margin-bottom:24px}
.spin{display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
.big{font-family:'Syne',sans-serif;font-size:44px;font-weight:800;line-height:1}
.comp{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:13px;align-items:center}
.comp .bar{grid-column:1 / -1;margin-bottom:8px}
.itemcard{border:1px solid var(--border);border-radius:16px;padding:14px;background:var(--surface)}
.itemcard.done{border-color:rgba(45,122,74,.35);background:var(--ok-bg)}
.itemcard .hd2{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:420px){.two.keep{grid-template-columns:1fr}}

.staff-top{padding:18px 18px 0;display:flex;flex-direction:column;gap:14px}
.th-staff #main{padding-top:14px}

.role-admin .app{max-width:980px}
@media(min-width:720px){.kpis{grid-template-columns:repeat(4,1fr)}}
.role-admin nav.tabs button{font-size:12px;padding:0 4px}
</style>
</head>
<body class="th-staff">
<div id="app"></div>
<div id="modalRoot"></div>
<script>
(function () {
  'use strict';
  var SYSTEM_NAME = <?= JSON.stringify(systemName) ?>;
  var STORE = 'spt_code';
  var DEEP = <?!= deep ?>;

  /* ---------- util ---------- */
  function $(s, el) { return (el || document).querySelector(s); }
  function h(tag, attrs) {
    var el = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      var v = attrs[k];
      if (v === null || v === undefined || v === false) return;
      if (k === 'class') el.className = v;
      else if (k === 'text') el.textContent = v;
      else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
      else if (k === 'value') el.value = v;
      else el.setAttribute(k, v === true ? '' : v);
    });
    for (var i = 2; i < arguments.length; i++) add(el, arguments[i]);
    return el;
  }
  function add(el, c) {
    if (c === null || c === undefined || c === false) return;
    if (Array.isArray(c)) { c.forEach(function (x) { add(el, x); }); return; }
    el.appendChild(typeof c === 'object' ? c : document.createTextNode(String(c)));
  }
  function clear(el) { while (el.firstChild) el.removeChild(el.firstChild); return el; }
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } }
  var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
  function dmy(s) { if (!s) return '-'; var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s); return m ? (+m[3]) + ' ' + MON[+m[2] - 1] + ' ' + m[1] : s; }
  function dmyT(s) { if (!s) return '-'; var m = /^(\d{4})-(\d{2})-(\d{2}) (\d{2}:\d{2})/.exec(s); return m ? (+m[3]) + ' ' + MON[+m[2] - 1] + ' ' + m[1] + ' ' + m[4] : s; }
  function pct(x) { return x === null || x === undefined ? '-' : Math.round(x * 100) + '%'; }
  function num(x, d) { return x === null || x === undefined ? '-' : (Math.round(x * Math.pow(10, d)) / Math.pow(10, d)).toString().replace('.', ','); }
  function uid() { return 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10); }
  function dur(d) { var a = Math.abs(d); if (a < 1) { var hr = Math.max(1, Math.round(a * 24)); return hr + ' jam'; } return Math.floor(a) + ' hari'; }
  function statusKey(s) { return s === 'IN PROGRESS' ? 'PROGRESS' : s; }

  /* ---------- API ---------- */
  var S = { code: '', meta: null, tab: '', busy: 0, lastTasks: null };
  function call(action, payload) {
    return new Promise(function (resolve, reject) {
      if (!window.google || !google.script || !google.script.run) { reject(new Error('Halaman harus dibuka dari link web app.')); return; }
      google.script.run
        .withSuccessHandler(function (txt) {
          var r; try { r = JSON.parse(txt); } catch (e) { reject(new Error('Respons server tidak valid.')); return; }
          if (r.ok) resolve(r.data); else reject(new Error(r.error || 'Gagal.'));
        })
        .withFailureHandler(function (e) { reject(new Error('Koneksi gagal: ' + (e && e.message ? e.message : e))); })
        .webApi(S.code, action, JSON.stringify(payload || {}));
    });
  }
  var toastT;
  function toast(msg, bad) {
    var old = $('.toast'); if (old) old.remove();
    var t = h('div', { class: 'toast' + (bad ? ' bad' : ''), role: 'status', text: msg }); document.body.appendChild(t);
    clearTimeout(toastT); toastT = setTimeout(function () { t.remove(); }, bad ? 6500 : 3200);
  }
  function busy(btn, on, label) {
    if (!btn) return;
    if (on) { btn._t = btn.textContent; clear(btn); btn.appendChild(h('span', { class: 'spin' })); btn.appendChild(document.createTextNode(' ' + (label || 'Memproses...'))); btn.disabled = true; }
    else { btn.textContent = btn._t || btn.textContent; btn.disabled = false; }
  }

  /* ---------- login (UI: ICS .auth-screen) ---------- */
  function setTheme(role) { document.body.className = 'th-staff' + (role === 'admin' ? ' role-admin' : ''); }
  function eyeToggle(inp) {
    return h('button', { type: 'button', 'aria-label': 'Tampilkan kode', style: 'position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px;padding:4px;line-height:1',
      onclick: function () { inp.type = inp.type === 'password' ? 'text' : 'password'; } }, '👁️');
  }
  function renderLogin(msg) {
    setTheme('staff'); stopClock();
    var app = clear($('#app'));
    var inp = h('input', { type: 'password', id: 'code', autocomplete: 'off', autocapitalize: 'characters', placeholder: 'XXXX-XXXX', 'aria-label': 'Kode akses', style: 'padding-right:46px' });
    var err = h('div', { class: 'err', role: 'alert', text: msg || '' });
    var btn = h('button', { class: 'btn block', type: 'submit', style: 'margin-top:4px' }, 'Masuk →');
    var form = h('form', { class: 'auth-card', onsubmit: function (e) {
      e.preventDefault(); var c = inp.value.trim(); if (!c) return;
      busy(btn, true, 'Memeriksa...'); S.code = c; err.textContent = '';
      call('login').then(function (meta) { store(STORE, c); start(meta); })
        .catch(function (x) { busy(btn, false); err.textContent = x.message; S.code = ''; });
    } }, h('h2', { text: 'Masuk ke Akun' }), h('p', { text: 'Gunakan kode akses pribadi dari admin' }),
      h('div', { class: 'fg', style: 'margin-bottom:16px' }, h('label', { class: 'f', for: 'code', text: 'Kode akses', style: 'margin-top:0' }), h('div', { style: 'position:relative' }, inp, eyeToggle(inp))), btn, err);
    app.appendChild(h('div', { class: 'auth-screen' },
      h('div', { class: 'auth-logo' }, h('h1', { text: 'TASK ICS' }), h('p', { text: 'INNOVATIVE CONSTRUCTION SOLUTIONS' })), form));
    setTimeout(function () { inp.focus(); }, 50);
  }
  function logout() { store(STORE, null); S.code = ''; S.meta = null; renderLogin(); }

  /* ---------- jam (pill karyawan / lclock admin) ---------- */
  var clockT = null;
  function stopClock() { if (clockT) { clearInterval(clockT); clockT = null; } }
  function startClock() {
    stopClock();
    function pad(n) { return n < 10 ? '0' + n : '' + n; }
    function tick() {

  function updateForm(t, reload, evidence) {
